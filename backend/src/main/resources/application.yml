server:
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:sqlite:${DB_PATH:backend/data/dashboard.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON;
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
app:
  user: ${APP_USER}
  password-hash: ${APP_PASSWORD_HASH}
  remember-me-key: ${REMEMBER_ME_KEY}
  media-root: ${MEDIA_ROOT:./media}
  kavita:
    url: ${KAVITA_URL:}
    api-key: ${KAVITA_API_KEY:}
  # Fallbacks for keys not set on the settings page. AniList needs no key.
  providers:
    mal-client-id: ${MAL_CLIENT_ID:}
    tmdb-token: ${TMDB_TOKEN:}
    igdb-client-id: ${IGDB_CLIENT_ID:}
    igdb-client-secret: ${IGDB_CLIENT_SECRET:}
  jellyfin:
    url: ${JELLYFIN_URL:}
    api-key: ${JELLYFIN_API_KEY:}
